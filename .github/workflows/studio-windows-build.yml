name: Package DiscLauncher Studio for Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'v2/**'
      - '.github/workflows/studio-windows-build.yml'
jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packager
        run: python -m pip install pyinstaller
      - name: Create desktop executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name DiscLauncher-Studio --paths v2 v2/gui.py
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: DiscLauncher-Studio-Windows
          path: dist/DiscLauncher-Studio.exe
